apiVersion: apps/v1
kind: Deployment
metadata:
  name: json-formatter
  namespace: json-formatter
  labels:
    app.kubernetes.io/name: json-formatter
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: json-formatter
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: json-formatter
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      # Give Spring time to finish in-flight requests after SIGTERM
      terminationGracePeriodSeconds: 40
      containers:
        - name: json-formatter
          image: json-formatter:1.0.0
          # Built straight into minikube's Docker daemon, so never pull from a registry
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: json-formatter-config
          # Boot can be slow to start under a cold JVM; startupProbe covers that
          # window so liveness/readiness stay tight once the app is up.
          startupProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # readOnlyRootFilesystem is on, but Tomcat still needs scratch space
            # for multipart uploads and the JVM for its perf data.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
