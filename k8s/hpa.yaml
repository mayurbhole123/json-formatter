# Requires: minikube addons enable metrics-server
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: json-formatter
  namespace: json-formatter
  labels:
    app.kubernetes.io/name: json-formatter
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: json-formatter
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
