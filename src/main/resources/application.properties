# --- Views: Thymeleaf templates under classpath:/templates ---
spring.thymeleaf.cache=true
spring.thymeleaf.encoding=UTF-8

# --- Server ---
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# --- Uploads (the "Upload" button on every tool page) ---
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Large payloads are normal for a JSON formatter
server.tomcat.max-http-form-post-size=20MB
server.tomcat.max-swallow-size=20MB
spring.mvc.async.request-timeout=60s

# Static assets live on the classpath under static/, served at /static/**
spring.mvc.static-path-pattern=/static/**
spring.web.resources.cache.cachecontrol.max-age=1h

# Surface real errors instead of a blank Whitelabel page
server.error.include-message=always
logging.level.org.springframework.web=INFO
